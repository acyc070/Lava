[CommonSettings]
SourcePath=Content/Localization/Menu_Localizations
DestinationPath=Content/Localization/Menu_Localizations
ManifestName=Menu_Localizations.manifest
ArchiveName=Menu_Localizations.archive
ResourceName=Menu_Localizations.locres
;  'en-US', 'ar', 'de', 'es', 'ja', 'es-419', 'fr', 'it', 'pl', 'pt', 'ru'
NativeCulture=en-US
CulturesToGenerate=en-US
CulturesToGenerate=ar
CulturesToGenerate=de
CulturesToGenerate=es
CulturesToGenerate=es-419
CulturesToGenerate=fr
CulturesToGenerate=it
CulturesToGenerate=ja
CulturesToGenerate=pl
CulturesToGenerate=pt
CulturesToGenerate=ru

[GatherTextStep0]
