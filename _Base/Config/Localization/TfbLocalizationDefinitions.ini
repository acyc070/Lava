; TfbLocalizationDefinitions.ini - MP4 loc mappings and WWise language translations

[MP4TrackMappings]
; --- the 'languages' tag is in the order of the tracks we expect to find. It is indexed by current culture
;  Track 0 is played if the language isn't found in this list
languages=en-us,ar,de,es,ja,es-419,fr,it,pt
CulturesToGenerate=en-US
CulturesToGenerate=ar
CulturesToGenerate=de
CulturesToGenerate=es
CulturesToGenerate=ja
CulturesToGenerate=es-419
CulturesToGenerate=fr
CulturesToGenerate=it
CulturesToGenerate=pt

; fix this when we have time. Each entry should be on its own line
[WWiseLanguageMappings]
WwiseEquivalents=en:English(US),en-us:English(US),en-US:English(US),es-419:latam,pt-BR:pt,nb:no,fr-CA:fr,nb-NO:no,ru:English(US),pl:English(US)
