[CommonSettings]
SourcePath=Content/Localization/VO_DataTables
DestinationPath=Content/Localization/VO_DataTables
ManifestName=VO_DataTables.manifest
ArchiveName=VO_DataTables.archive
ResourceName=VO_DataTables.locres
;  'en-US', 'ar', 'de', 'es', 'ja', 'es-419', 'fr', 'it', 'pl', 'pt', 'ru'
NativeCulture=en-US
CulturesToGenerate=en-US
CulturesToGenerate=ar
CulturesToGenerate=de
CulturesToGenerate=es
CulturesToGenerate=es-419
CulturesToGenerate=fr
CulturesToGenerate=it
CulturesToGenerate=ja
CulturesToGenerate=pl
CulturesToGenerate=pt
CulturesToGenerate=ru

[GatherTextStep0]
CommandletClass=GatherTextFromAssets
IncludePathFilters=%LOCPROJECTROOT%Plugins/Levels/SinglePlayer/*/*/Cinematics/*/DT_*
IncludePathFilters=%LOCPROJECTROOT%Plugins/Objects/GameplayObjects/GP_SinglePlayer/Content/Audio/DT_*
ExcludePathFilters=Content/Localization/*
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep1]
CommandletClass=GenerateGatherManifest

[GatherTextStep2]
CommandletClass=GenerateGatherArchive

[GatherTextStep3]
CommandletClass=GenerateTextLocalizationResource

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=VO_DataTables.csv
bConflictReport=true
ConflictReportName=VO_DataTables_Conflicts.txt



