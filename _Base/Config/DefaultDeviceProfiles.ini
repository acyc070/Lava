;
; Screen/Display
;

; 720p backbuffer
+CVars=r.setres=1280x720

; Low Latency frame syncing, sync to GPU swap chain, not render thread.
+CVars=r.GTSyncType=2
+CVars=rhi.SyncSlackMS=2
+CVars=rhi.syncinterval=2

; forced on by other settings, but set explicitly here for clarity
+CVars=r.Vsync=1

; Temporal Upsampling
+CVars=r.TemporalAA.Upsampling=1

;
; TFB Overrides
;
+CVars=r.MaterialQualityLevel=0
+CVars=r.SceneColorFormat=2

; get some memory back by reducing the vfx gpu simulation buffer
+CVars=fx.GPUSimulationTextureSizeX=256
+CVars=fx.GPUSimulationTextureSizeY=256

; reduce shadow atlas memory, which can be as high as 200MB or more for some levels, reduce
; map size, cascade count, usage of the atlas (texels per pixel) and disable the whole scene
; shadow cache
+CVars=r.Shadow.MaxResolution=256
+CVars=r.Shadow.MaxCSMResolution=512
+CVars=r.Shadow.CSM.MaxCascades=1
+CVars=r.Shadow.TexelsPerPixel=0.8
+CVars=r.Shadow.TexelsPerPixelPointlight=1.0
+CVars=r.Shadow.TexelsPerPixelRectlight=1.0
+CVars=r.Shadow.TexelsPerPixelSpotlight=1.0
+CVars=r.ShadowQuality=3
+CVars=r.Shadow.MaxNumFarShadowCascades=2
+CVars=r.Shadow.WholeSceneShadowCacheMb=0
+CVars=r.Shadow.CacheWholeSceneShadows=0
+CVars=r.Shadow.CachedShadowsCastFromMovablePrimitives=0
+CVars=r.MotionBlurQuality=0

; a more draconian approach
;+CVars=r.Shadow.FarShadowDistanceOverride

;
; Lighting
;

; default is 0.6, but levels look too dark on switch so increased to 1.0
+CVars=r.SkylightIntensityMultiplier=1.0


[SwitchConsole DeviceProfile]
DeviceType=Switch
BaseProfileName=Switch
; Copied from Falcon
+CVars=sg.ViewDistanceQuality=2
+CVars=sg.AntiAliasingQuality=2
+CVars=sg.ShadowQuality=1
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=3
+CVars=sg.EffectsQuality=1
+CVars=r.StaticMeshLODDistanceScale=1
+CVars=r.TemporalAAUpsampleFiltered=0
+CVars=r.TemporalAA.AllowDownsampling=1
+CVars=sg.FoliageQuality=2
+CVars=foliage.MinLOD=1
+CVars=r.ViewDistanceScale=0.8
; Dynamic resolution settings. When docked, we can afford TAA-based upscaling (which is crisper) and can set a higher floor.
;  - Enable dynamic resolution, set its min/max values, and define its performance target.
+CVars=r.DynamicRes.OperationMode=2
+CVars=r.DynamicRes.MaxScreenPercentage=100
+CVars=r.DynamicRes.MinScreenPercentage=70
+CVars=r.DynamicRes.TargetedGPUHeadRoomPercentage=5
;  - Enable TAA-based upsampling. This makes the TAA pass more expensive but gives far crisper results than non-TAA.
+CVars=r.TemporalAA.Upsampling=1
;  - Disable secondary game viewport scaling, which is a multiplicative value on top of dynamic resolution that is
;    applied in a second, blurrier pass after crisp TAA upscaling.
+CVars=r.SecondaryScreenPercentage.GameViewport=100
; Enable eye adaptation. This is off by default with our low PostProcessQuality value, but since Xbox/PS4 shipped with
;   it on the lighting was tuned around that. This is barely any perf hit at all so it's safe to enable.
+CVars=r.EyeAdaptationQuality=2

[SwitchHandheld DeviceProfile]
DeviceType=Switch
BaseProfileName=Switch
; Copied from Falcon
+CVars=sg.ViewDistanceQuality=1
; Anti-aliasing quality of 1 introduces some serious dithering issues in SSAO and shadows, but it's largely unnoticeable
; on the handheld display and saves us 4-5 ms of frame time. It's more obvious when dynamic resolution is low, and much
; more obvious when it's being output to a TV over the debug HDMI port.
+CVars=sg.AntiAliasingQuality=1
+CVars=sg.ShadowQuality=1
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=1
+CVars=sg.EffectsQuality=0
+CVars=r.StaticMeshLODDistanceScale=1.5
+CVars=sg.FoliageQuality=1
+CVars=foliage.MinLOD=2
+CVars=r.Shadow.DistanceScale=0
+CVars=r.ViewDistanceScale=0.8
; Dynamic resolution settings. While undocked, we need a more forgiving minimum resolution and cannot afford to use TAA
; upscaling. Ideally, we'd want to set a higher minimum resolution, but given Quantum's timeline and limited availability
; of artist time, we need to trade extra blurriness for smooth framerate. Future projects looking at this config file for
; an example may want to set this value higher for improved minimum visual fidelity and make optimizations based on the
; new numbers.
;  - Enable dynamic resolution, set its min/max values, and define its performance target.
+CVars=r.DynamicRes.OperationMode=2
+CVars=r.DynamicRes.MaxScreenPercentage=100
+CVars=r.DynamicRes.MinScreenPercentage=50
+CVars=r.DynamicRes.TargetedGPUHeadRoomPercentage=5
;  - Disable TAA-based upsampling. Although this gives less-crisp results, it saves 1-2 ms of rendering time across the
;    board. Also, set the upscaling algorithm to use bicubic sharpening.
+CVars=r.TemporalAA.Upsampling=0
+CVars=r.Upscale.Quality=3
;  - Disable secondary game viewport scaling, which is a multiplicative value on top of dynamic resolution. Although this
;    happens at the same time as non-TAA upscaling, it still lowers the effective minimum and maximum resolutions and is
;    not accounted for by the dynamic scaling math. If we need to cap rendering percentage while using non-TAA upsampling,
;    changing the maximum dynamic resolution is a more easily-understood way to do so with the same end result.
+CVars=r.SecondaryScreenPercentage.GameViewport=100
; Enable eye adaptation. This is off by default with our low PostProcessQuality value, but since Xbox/PS4 shipped with
;   it on the lighting was tuned around that. This is barely any perf hit at all so it's safe to enable.
+CVars=r.EyeAdaptationQuality=2

